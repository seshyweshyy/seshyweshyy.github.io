<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>seshyweshyy | Games</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="images/games.png">
</head>
<body>
  <header>
    <h1>Games</h1>
    <nav class="glass-nav">
      <a href="index">Home</a>
      <a href="about">About Me</a>
      <a href="games" class="active">Games</a>
      <a href="links">Links</a>
    </nav>
  </header>

  <main>
    <p class="subtitle">Select a game to play</p>
    <section class="game-grid">
      <div class="glass-btn-wrap glass-btn-wrap--tile">
        <a href="games/make10" class="glass-btn glass-btn--tile">
          <span class="glass-btn-label glass-btn-label--tile">
            <img src="images/make10.jpg" alt="Make 10 Icon">
            <h3>Make 10!</h3>
          </span>
        </a>
        <div class="glass-btn-shadow"></div>
      </div>

      <div class="glass-btn-wrap glass-btn-wrap--tile">
        <a href="games/slitherclone/public/index" class="glass-btn glass-btn--tile">
          <span class="glass-btn-label glass-btn-label--tile">
            <img src="images/slither.png" alt="snake.clone Icon">
            <h3>snake.clone</h3>
          </span>
        </a>
        <div class="glass-btn-shadow"></div>
      </div>

      <div class="glass-btn-wrap glass-btn-wrap--tile">
        <a href="games/tetris" class="glass-btn glass-btn--tile">
          <span class="glass-btn-label glass-btn-label--tile">
            <img src="images/tetris.jpg" alt="Tetris Icon">
            <h3>Tetris</h3>
          </span>
        </a>
        <div class="glass-btn-shadow"></div>
      </div>

      <div class="glass-btn-wrap glass-btn-wrap--tile">
        <a href="games/flappy-bird" class="glass-btn glass-btn--tile">
          <span class="glass-btn-label glass-btn-label--tile">
            <img src="images/flappy-bird.svg" alt="Flappy Bird Icon">
            <h3>Flappy Bird</h3>
          </span>
        </a>
        <div class="glass-btn-shadow"></div>
      </div>

      <div class="glass-btn-wrap glass-btn-wrap--tile">
        <a href="games/top-down-shooter/" class="glass-btn glass-btn--tile">
          <span class="glass-btn-label glass-btn-label--tile">
            <img src="images/games.png" alt="Top-Down Shooter Icon">
            <h3>Top-Down Shooter</h3>
          </span>
        </a>
        <div class="glass-btn-shadow"></div>
      </div>

      <div class="glass-btn-wrap glass-btn-wrap--tile">
        <a href="games/hangman" class="glass-btn glass-btn--tile">
          <span class="glass-btn-label glass-btn-label--tile">
            <img src="images/games.png" alt="Hangman Icon">
            <h3>Hangman</h3>
          </span>
        </a>
        <div class="glass-btn-shadow"></div>
      </div>
    </section>
  </main>
  <footer>
    <p>© 2026 seshyweshyy</p>
  </footer>
  <script src="nav.js"></script>
</body>
</html>
